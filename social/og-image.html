<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Social thumbnail source</title>
<!-- Source of the social thumbnail (1200x630). Re-render with: npm run social -->
<link rel="stylesheet" href="../public/fonts/fonts.css">
<style>
  :root{--slate:#476774;--black:#121517;--white:#F4F7F8;--pale:#E2E9EC}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--slate);color:var(--white);font-family:"Inter",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
  .logo{display:block;width:504px;height:auto}
  .what{font-size:26px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--pale)}
  .cta{background:var(--black);color:var(--white);font-family:"Oswald",Impact,"Arial Narrow",sans-serif;
    font-weight:500;text-transform:uppercase;font-size:34px;letter-spacing:.03em;line-height:1;padding:17px 30px}
</style>
</head>
<body>
  <img class="logo" src="../public/assets/img/logo.png" alt="">
  <p class="what">Carpenter and builder · Greater London</p>
  <p class="cta">Free consultation · 07480 243 158</p>
</body>
</html>
